name: Publish Marc Shared build metadata

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Marc Shared release tag to annotate, or latest
        required: false
        default: latest
        type: string
  pull_request:
    paths:
      - .github/workflows/publish-marc-shared-buildinfo.yml
      - .github/scripts/create-marc-shared-buildinfo.sh
      - variants/win64-marc-shared.policy.sh
      - generate.sh
      - scripts.d/50-ffnvcodec.sh

permissions:
  contents: read
  packages: read

concurrency:
  group: publish-marc-shared-buildinfo-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  buildinfo:
    name: Generate buildinfo.json
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Resolve release provenance
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          TARGET_REPO: ghcr.io/marcmy/ffmpeg-builds
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag="$(jq -r '.release.tag_name' "$GITHUB_EVENT_PATH")"
          elif [[ -n "${REQUESTED_TAG:-}" && "$REQUESTED_TAG" != "latest" ]]; then
            tag="$REQUESTED_TAG"
          else
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          fi

          if [[ -z "$tag" ]]; then
            echo "Unable to resolve release tag." >&2
            exit 1
          fi

          body="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')"
          field() {
            local label="$1"
            sed -n "s/^${label}: //p" <<< "$body" | head -n 1
          }

          ffmpeg_sha="$(field 'Upstream FFmpeg master SHA')"
          builder_sha="$(field 'Builder repository SHA')"
          image_input_sha="$(field 'Dependency image input SHA')"

          if [[ -z "$ffmpeg_sha" || -z "$builder_sha" || -z "$image_input_sha" ]]; then
            echo "Release notes do not contain the required build provenance fields." >&2
            printf '%s\n' "$body" >&2
            exit 1
          fi

          image_ref="${TARGET_REPO}/win64-marc-shared:source-${image_input_sha}"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ffmpeg_sha=$ffmpeg_sha" >> "$GITHUB_OUTPUT"
          echo "builder_sha=$builder_sha" >> "$GITHUB_OUTPUT"
          echo "image_input_sha=$image_input_sha" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

          echo "Release tag: $tag"
          echo "FFmpeg SHA: $ffmpeg_sha"
          echo "Builder SHA: $builder_sha"
          echo "Dependency image input SHA: $image_input_sha"
          echo "Dependency image: $image_ref"

      - name: Check out pull-request validation revision
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out exact builder revision
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.builder_sha }}
          persist-credentials: false

      - name: Download published package
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-download release-metadata
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*-win64-marc-shared.zip' \
            --dir release-download \
            --clobber

          mapfile -t archives < <(find release-download -maxdepth 1 -type f -name '*.zip' -print)
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one Marc Shared ZIP, found ${#archives[@]}." >&2
            exit 1
          fi

          echo "zip_path=${archives[0]}" >> "$GITHUB_OUTPUT"
          sha256sum "${archives[0]}"

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Pull exact dependency image
        env:
          IMAGE_REF: ${{ steps.release.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"

      - name: Generate buildinfo.json
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          BUILDINFO_PATH: release-metadata/buildinfo.json
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          FFMPEG_SHA: ${{ steps.release.outputs.ffmpeg_sha }}
          BUILDER_SHA: ${{ steps.release.outputs.builder_sha }}
          IMAGE_INPUT_SHA: ${{ steps.release.outputs.image_input_sha }}
          IMAGE_REF: ${{ steps.release.outputs.image_ref }}
          TARGET: win64
          VARIANT: marc-shared
          UPSTREAM_REPO: https://github.com/FFmpeg/FFmpeg.git
        run: |
          set -euo pipefail
          bash .github/scripts/create-marc-shared-buildinfo.sh

      - name: Upload build metadata artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marc-shared-buildinfo-${{ steps.release.outputs.tag }}
          path: release-metadata/buildinfo.json
          if-no-files-found: error
          retention-days: 30

  publish-buildinfo:
    name: Attach buildinfo.json to release
    if: ${{ github.event_name != 'pull_request' }}
    needs: buildinfo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download build metadata from this run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.buildinfo.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "marc-shared-buildinfo-${RELEASE_TAG}" \
            --dir release-metadata

      - name: Upload buildinfo.json to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.buildinfo.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            release-metadata/buildinfo.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
